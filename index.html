<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#222);--hint:var(--tg-theme-hint-color,#888);--sec:var(--tg-theme-secondary-bg-color,#f3f3f6);--btn:var(--tg-theme-button-color,#e5547a);--btnt:var(--tg-theme-button-text-color,#fff);--red:#e5547a;--green:#4caf7a}
*{box-sizing:border-box}
body{margin:0;padding:12px;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.sum{background:var(--sec);border-radius:14px;padding:14px;margin-bottom:12px;line-height:1.4}
.sum b{font-size:18px}
.nav{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.nav button{background:none;border:0;font-size:22px;color:var(--tx);padding:6px 14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:12px;color:var(--hint)}
.d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;border:2px solid transparent;position:relative}
.d.per{background:var(--red);color:#fff}
.d.pred{border:2px dashed var(--red)}
.d.fert{background:#e2f4e8;color:#222}
.d.ov{border:2px solid var(--green)}
.d.today{font-weight:700;text-decoration:underline}
.d small{font-size:10px;line-height:1;height:10px}
.legend{font-size:12px;color:var(--hint);margin-top:10px;line-height:1.6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet.on{display:flex}
.card{background:var(--bg);width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.card h3{margin:0 0 10px}
.row{display:flex;gap:16px;margin:8px 0}
.row label{display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{padding:6px 10px;border-radius:16px;background:var(--sec);font-size:14px;border:1px solid transparent}
.chip.on{border-color:var(--red);background:#fde6ec;color:#222}
textarea{width:100%;min-height:64px;border-radius:10px;border:1px solid var(--sec);background:var(--sec);color:var(--tx);padding:8px;font:inherit}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;padding:12px;border-radius:12px;border:0;font-size:16px;background:var(--sec);color:var(--tx)}
.btns .ok{background:var(--btn);color:var(--btnt)}
.ro .chip,.ro label,.ro textarea{pointer-events:none}
</style></head>
<body>
<div class="sum" id="sum">Загрузка…</div>
<div class="nav"><button id="prev">‹</button><b id="title"></b><button id="next">›</button></div>
<div class="grid" id="grid"></div>
<div class="legend">Красный – месячные, пунктир – прогноз месячных, зелёный фон – вероятные фертильные дни, зелёная рамка – овуляция, ♥ – близость, точка – симптомы или заметка. Прогноз приблизительный.</div>
<div class="sheet" id="sheet"><div class="card" id="card"></div></div>
<script>
const tgw = window.Telegram.WebApp; tgw.ready(); tgw.expand();
const SYM = ['Боль внизу живота','Головная боль','Усталость','Перепады настроения','Раздражительность','Тошнота','Отёки','Тяга к сладкому','Болит грудь','Акне','Хорошее настроение','Много энергии'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let data = {}, role = 'viewer', cur = new Date();
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const api = (url, body) => fetch(url, {
  method: body ? 'POST' : 'GET',
  headers: {'Content-Type':'application/json','x-init':tgw.initData},
  body: body ? JSON.stringify(body) : undefined
}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

function predict() {
  const days = Object.keys(data).filter(k => data[k].period).sort();
  const starts = days.filter(k => !(data[iso(addDays(fromIso(k),-1))] || {}).period);
  const gaps = [];
  for (let i = 1; i < starts.length; i++) gaps.push((fromIso(starts[i]) - fromIso(starts[i-1])) / 864e5);
  const ok = gaps.slice(-6).filter(g => g >= 18 && g <= 60);
  const cycle = ok.length ? Math.round(ok.reduce((a,b) => a+b) / ok.length) : 28;
  const lens = starts.slice(-6).map(s => { let n = 0; while ((data[iso(addDays(fromIso(s),n))] || {}).period) n++; return n; });
  const plen = lens.length ? Math.round(lens.reduce((a,b) => a+b) / lens.length) : 5;
  const r = { pp: new Set(), fw: new Set(), ov: new Set(), next: null, cycle, last: null };
  if (!starts.length) return r;
  r.last = fromIso(starts[starts.length-1]);
  for (let c = 1; c <= 4; c++) {
    const s = addDays(r.last, cycle*c);
    if (c === 1) r.next = s;
    for (let i = 0; i < plen; i++) r.pp.add(iso(addDays(s,i)));
    const o = addDays(s,-14);
    r.ov.add(iso(o));
    for (let i = -5; i <= 1; i++) r.fw.add(iso(addDays(o,i)));
  }
  return r;
}

function render() {
  const p = predict(), today = new Date(); today.setHours(0,0,0,0);
  const fmt = d => d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  if (!p.last) {
    document.getElementById('sum').textContent = role === 'owner' ? 'Отметь первый день месячных, и появится прогноз.' : 'Пока нет данных для прогноза.';
  } else {
    const day = Math.round((today - p.last) / 864e5) + 1;
    const left = Math.round((p.next - today) / 864e5);
    const when = left > 0 ? `через ${left} дн. (${fmt(p.next)})` : left === 0 ? 'ожидаются сегодня' : `ожидались ${fmt(p.next)}, задержка ${-left} дн.`;
    document.getElementById('sum').innerHTML = `День цикла: <b>${day}</b><br>Следующие месячные: ${when}<br>Средний цикл: ${p.cycle} дн.`;
  }
  document.getElementById('title').textContent = `${MONTHS[cur.getMonth()]} ${cur.getFullYear()}`;
  const g = document.getElementById('grid'); g.innerHTML = '';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w => { const e = document.createElement('div'); e.className = 'wd'; e.textContent = w; g.appendChild(e); });
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) g.appendChild(document.createElement('div'));
  const n = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
  for (let d = 1; d <= n; d++) {
    const dt = new Date(cur.getFullYear(), cur.getMonth(), d), k = iso(dt), e = data[k] || {};
    const el = document.createElement('div'); el.className = 'd';
    if (e.period) el.classList.add('per');
    else if (dt >= today && p.pp.has(k)) el.classList.add('pred');
    if (!e.period && p.fw.has(k) && dt >= addDays(today,-14)) el.classList.add('fert');
    if (p.ov.has(k) && dt >= addDays(today,-14)) el.classList.add('ov');
    if (dt.getTime() === today.getTime()) el.classList.add('today');
    const mark = (e.sex ? '♥' : '') + ((e.symptoms && e.symptoms.length) || e.note ? '•' : '');
    el.innerHTML = `<span>${d}</span><small>${mark}</small>`;
    el.onclick = () => openDay(k);
    g.appendChild(el);
  }
}

function openDay(k) {
  const e = data[k] || {period:false, sex:false, symptoms:[], note:''};
  const ro = role !== 'owner';
  const sel = new Set(e.symptoms || []);
  const card = document.getElementById('card');
  card.className = 'card' + (ro ? ' ro' : '');
  card.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = fromIso(k).toLocaleDateString('ru-RU', {day:'numeric', month:'long', weekday:'long'}); card.appendChild(h);
  const row = document.createElement('div'); row.className = 'row';
  const mk = (text, val) => { const l = document.createElement('label'), c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!val; l.append(c, text); row.appendChild(l); return c; };
  const per = mk('Месячные', e.period), sex = mk('Близость', e.sex);
  card.appendChild(row);
  const chips = document.createElement('div'); chips.className = 'chips';
  SYM.forEach(s => { const c = document.createElement('div'); c.className = 'chip' + (sel.has(s) ? ' on' : ''); c.textContent = s; c.onclick = () => { sel.has(s) ? sel.delete(s) : sel.add(s); c.classList.toggle('on'); }; chips.appendChild(c); });
  card.appendChild(chips);
  const note = document.createElement('textarea'); note.placeholder = 'Заметка'; note.value = e.note || ''; note.readOnly = ro; card.appendChild(note);
  const b = document.createElement('div'); b.className = 'btns';
  const close = document.createElement('button'); close.textContent = ro ? 'Закрыть' : 'Отмена'; close.onclick = () => document.getElementById('sheet').classList.remove('on'); b.appendChild(close);
  if (!ro) {
    const ok = document.createElement('button'); ok.className = 'ok'; ok.textContent = 'Сохранить';
    ok.onclick = async () => {
      const body = {date:k, period:per.checked, sex:sex.checked, symptoms:[...sel], note:note.value};
      try {
        await api('/api/day', body);
        if (!body.period && !body.sex && !body.symptoms.length && !body.note) delete data[k]; else data[k] = body;
        document.getElementById('sheet').classList.remove('on'); render();
      } catch { tgw.showAlert('Не удалось сохранить, попробуй ещё раз.'); }
    };
    b.appendChild(ok);
  }
  card.appendChild(b);
  document.getElementById('sheet').classList.add('on');
}

document.getElementById('prev').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth()-1, 1); render(); };
document.getElementById('next').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1); render(); };
document.getElementById('sheet').onclick = e => { if (e.target.id === 'sheet') e.target.classList.remove('on'); };

api('/api/data').then(r => { role = r.role; data = r.data; render(); })
  .catch(() => { document.getElementById('sum').textContent = 'Нет доступа. Открой приложение через бота.'; });
</script></body></html>
