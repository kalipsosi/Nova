services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    # Слушает только локальный интерфейс этой машины, не 0.0.0.0.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nova_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nova_pg:
